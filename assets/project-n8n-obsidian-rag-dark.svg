<svg xmlns="http://www.w3.org/2000/svg" width="350" height="130" viewBox="0 0 350 130" role="img" aria-label="n8n-obsidian-rag"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans',Helvetica,Arial,sans-serif}</style><rect x=".5" y=".5" width="349" height="129" rx="6" fill="#0d1117" stroke="#30363d"/><text x="20" y="34" font-size="15" font-weight="600" fill="#4493f8">n8n-obsidian-rag</text><text x="20" y="60" font-size="13" fill="#e6edf3">옵시디언 노트를 근거로 디스코드에서 답하는</text><text x="20" y="79" font-size="13" fill="#e6edf3">RAG 봇. 골든 60문항으로 품질 측정</text><text x="20" y="112" font-size="12" fill="#9198a1">n8n  ·  RAG  ·  Discord</text></svg>